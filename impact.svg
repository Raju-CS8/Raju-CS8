<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="52 of 52 Jest tests, 48 of 48 tests, 6.49 jobs per second, 2 AI/ML internships" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Fira Code',ui-monospace,Menlo,Consolas,monospace}
    .edge{animation:glow 3.5s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
    .rise{animation:rise .8s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>

  <g class="rise">
    <rect x="30" y="20" width="270" height="150" rx="18" fill="url(#card)"/>
    <rect class="edge" x="30" y="20" width="270" height="150" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <text class="sans" x="165" y="98" text-anchor="middle" font-size="56" font-weight="900" fill="url(#num)">52/52</text>
    <text class="mono" x="165" y="128" text-anchor="middle" font-size="14" fill="#cbd5e1">Jest tests</text>
    <text class="mono" x="165" y="150" text-anchor="middle" font-size="13" fill="#64748b">NeuralIQ · 8 suites</text>
  </g>
  <g class="rise" style="animation-delay:.15s">
    <rect x="320" y="20" width="270" height="150" rx="18" fill="url(#card)"/>
    <rect class="edge" x="320" y="20" width="270" height="150" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" style="animation-delay:.6s"/>
    <text class="sans" x="455" y="98" text-anchor="middle" font-size="56" font-weight="900" fill="url(#num)">48/48</text>
    <text class="mono" x="455" y="128" text-anchor="middle" font-size="14" fill="#cbd5e1">automated tests</text>
    <text class="mono" x="455" y="150" text-anchor="middle" font-size="13" fill="#64748b">JobFlow · GitHub Actions CI</text>
  </g>
  <g class="rise" style="animation-delay:.3s">
    <rect x="610" y="20" width="270" height="150" rx="18" fill="url(#card)"/>
    <rect class="edge" x="610" y="20" width="270" height="150" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" style="animation-delay:1.2s"/>
    <text class="sans" x="745" y="98" text-anchor="middle" font-size="56" font-weight="900" fill="url(#num)">6.49</text>
    <text class="mono" x="745" y="128" text-anchor="middle" font-size="14" fill="#cbd5e1">jobs / second</text>
    <text class="mono" x="745" y="150" text-anchor="middle" font-size="13" fill="#64748b">200 jobs · 3 workers</text>
  </g>
  <g class="rise" style="animation-delay:.45s">
    <rect x="900" y="20" width="270" height="150" rx="18" fill="url(#card)"/>
    <rect class="edge" x="900" y="20" width="270" height="150" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" style="animation-delay:1.8s"/>
    <text class="sans" x="1035" y="98" text-anchor="middle" font-size="56" font-weight="900" fill="url(#num)">2</text>
    <text class="mono" x="1035" y="128" text-anchor="middle" font-size="14" fill="#cbd5e1">AI/ML internships</text>
    <text class="mono" x="1035" y="150" text-anchor="middle" font-size="13" fill="#64748b">Infosys · Acmegrade</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
