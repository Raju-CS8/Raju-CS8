<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Raju P. SDE, Full Stack, AI. Bengaluru, Pune, Mumbai and everywhere." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.6 0" to="0.6 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#e879f9" stop-opacity="0.35"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></radialGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="430" rx="22"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'Fira Code','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .glyph{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:30px;fill:#67e8f9;opacity:.14;animation:float 7s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    .orb{animation:pulse 5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(440px)}}
    .pill{animation:rise .9s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2s ease-in-out infinite}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>

    <circle class="orb" cx="150" cy="90" r="260" fill="url(#orbA)"/>
    <circle class="orb" cx="1070" cy="360" r="280" fill="url(#orbB)" style="animation-delay:1.5s"/>
    <circle class="orb" cx="640" cy="-20" r="240" fill="url(#orbC)" style="animation-delay:3s"/>

    <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#scanG)"/>

    <text class="glyph" x="70" y="150">{ }</text>
    <text class="glyph" x="160" y="330" style="animation-delay:1s">&lt;/&gt;</text>
    <text class="glyph" x="1010" y="130" style="animation-delay:2s">=&gt;</text>
    <text class="glyph" x="1090" y="290" style="animation-delay:.5s">[ ]</text>
    <text class="glyph" x="920" y="60" style="animation-delay:3s">AI</text>
    <text class="glyph" x="250" y="70" style="animation-delay:2.4s">SQL</text>
    <text class="glyph" x="60" y="260" style="animation-delay:3.6s">01</text>
    <text class="glyph" x="1120" y="190" style="animation-delay:1.8s">git</text>

    <text class="mono" x="600" y="98" text-anchor="middle" font-size="17" letter-spacing="7" fill="#67e8f9" fill-opacity="0.8">&lt; HELLO WORLD, I'M /&gt;</text>

    <text class="sans" x="600" y="222" text-anchor="middle" font-size="124" font-weight="900" letter-spacing="10" fill="url(#name)" filter="url(#glow)">RAJU P</text>

    <text class="mono" x="356" y="282" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="9" fill="#e0f2fe">SDE</text>
    <circle cx="425" cy="269" r="5" fill="#6366f1"/>
    <text class="mono" x="600" y="282" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="9" fill="#e0f2fe">FULL STACK</text>
    <circle cx="775" cy="269" r="5" fill="#6366f1"/>
    <text class="mono" x="830" y="282" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="9" fill="#e0f2fe">AI</text>

    <g class="pill" style="animation-delay:.2s">
      <rect x="271" y="318" width="170" height="44" rx="22" fill="#0f172a" fill-opacity="0.85" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle class="dot" cx="297" cy="340" r="5" fill="#22d3ee"/>
      <text class="mono" x="372" y="346" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#e0f2fe">BENGALURU</text>
    </g>
    <g class="pill" style="animation-delay:.45s">
      <rect x="457" y="318" width="110" height="44" rx="22" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.7"/>
      <circle class="dot" cx="483" cy="340" r="5" fill="#818cf8" style="animation-delay:.4s"/>
      <text class="mono" x="528" y="346" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#e0f2fe">PUNE</text>
    </g>
    <g class="pill" style="animation-delay:.7s">
      <rect x="583" y="318" width="140" height="44" rx="22" fill="#0f172a" fill-opacity="0.85" stroke="#c084fc" stroke-opacity="0.7"/>
      <circle class="dot" cx="609" cy="340" r="5" fill="#c084fc" style="animation-delay:.8s"/>
      <text class="mono" x="668" y="346" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#e0f2fe">MUMBAI</text>
    </g>
    <g class="pill" style="animation-delay:.95s">
      <rect x="739" y="318" width="190" height="44" rx="22" fill="#0f172a" fill-opacity="0.85" stroke="#e879f9" stroke-opacity="0.7"/>
      <circle class="dot" cx="765" cy="340" r="5" fill="#e879f9" style="animation-delay:1.2s"/>
      <text class="mono" x="852" y="346" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#e0f2fe">EVERYWHERE</text>
    </g>

    <text class="mono" x="600" y="404" text-anchor="middle" font-size="15" letter-spacing="1" fill="#94a3b8">&gt; open to work · entry-level roles &amp; internships · PPO preferred</text>
    <rect class="cursor" x="888" y="392" width="9" height="16" fill="#22d3ee"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="427" rx="21" fill="none" stroke="url(#border)" stroke-width="2" stroke-opacity="0.85"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
